services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: tracking
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: "12345678"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: "admin12345"
    ports:
      - "5050:80"

volumes:
  pgdata:

